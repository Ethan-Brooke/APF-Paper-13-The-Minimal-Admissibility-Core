[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apf-paper13"
version = "8.3-PLEC"
description = "Minimal Admissibility Core — executable mathematical appendix"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
  {name = "Ethan Brooke", email = "brooke.ethan@gmail.com"}
]
keywords = ["master reference", "framework summary", "APF core", "minimal admissibility"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.20", "scipy>=1.7"]

[project.urls]
Homepage = "https://github.com/Ethan-Brooke/APF-Paper-13-The-Minimal-Admissibility-Core"
"Bug Tracker" = "https://github.com/Ethan-Brooke/APF-Paper-13-The-Minimal-Admissibility-Core/issues"
"Zenodo" = "https://doi.org/10.5281/zenodo.18614663"

[tool.setuptools.packages.find]
include = ["apf*"]
